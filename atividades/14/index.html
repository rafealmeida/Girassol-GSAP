<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title> 14 </title>
</head>
<body>

    <script>
        let soma = 0;

        for (let numero = 1; numero <= 10; numero++) {
            soma = soma + numero;
        }

        alert("A soma dos números de 1 a 10 é: " + soma);
    </script>

</body>
</html>
