<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ff9ff2;
            text-align: center;
            margin-top: 80px;
        }

        h1 {
            color: white;
        }

        form {
            background-color: white;
            width: 350px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input {
            width: 250px;
            padding: 10px;
            border: 2px solid #ffb7b7;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #af4caa;
        }

        button {
            background-color: #95ca97;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #cffad1;
            color: #333;
        }
    </style>
</head>

<body>

    <h1>Formulário</h1>

    <form id="formulario">

        <label for="nome">Nome:</label>

        <input 
            type="text" 
            id="nome" 
            name="nome" 
            placeholder="Digite seu nome"
            required
        >

        <br>

        <button type="submit">Enviar</button>

    </form>

    <script src="script.js"></script>

</body>

</html>
