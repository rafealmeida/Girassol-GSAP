<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9</title>
</head>
<body>

    <a href="https://br.pinterest.com/pin/429249408272171692/" onclick="abrir(event)">
        Abrir Nova Página
    </a>

    <script>
        function abrir(event) {
            if (!window.confirm("Tem certeza que deseja abrir?")) {
                event.preventDefault();
                window.alert("Boa escolha, cancele mesmo...");
            }
        }
    </script>

</body>
</html>
