<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 01</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="wrapper">
        <header class="header gsap__anim">
            <div class="parallax__wrapp">
                <div class="content">
                    <h1 class="title">Scroll<span class="stroke">Please</span></h1>
                </div>
            </div>
        </header>

        <main class="main">
            <!--Girassol-->
            <section class="section gsap__anim scroll-container">
                <div class="parallax__wrapp girassol-box">
                    <svg id="flower" viewBox="0 0 200 200">
                        <!-- 10 Pétalas de Girassol simplificadas -->
                        <ellipse class="petal" cx="100" cy="30" rx="12" ry="45" fill="#FFC107" />
                        <ellipse class="petal" cx="100" cy="30" rx="12" ry="45" fill="#FFC107" />
                        <ellipse class="petal" cx="100" cy="30" rx="12" ry="45" fill="#FFC107" />
                        <ellipse class="petal" cx="100" cy="30" rx="12" ry="45" fill="#FFC107" />
                        <ellipse class="petal" cx="100" cy="30" rx="12" ry="45" fill="#FFC107" />
                        <ellipse class="petal" cx="100" cy="30" rx="12" ry="45" fill="#FFC107" />
                        <ellipse class="petal" cx="100" cy="30" rx="12" ry="45" fill="#FFC107" />
                        <ellipse class="petal" cx="100" cy="30" rx="12" ry="45" fill="#FFC107" />
                        <ellipse class="petal" cx="100" cy="30" rx="12" ry="45" fill="#FFC107" />
                        <ellipse class="petal" cx="100" cy="30" rx="12" ry="45" fill="#FFC107" />
                        <!-- Miolo do girassol -->
                        <circle cx="100" cy="100" r="30" fill="#5D4037" />
                    </svg>
                </div>
            </section>
        </main>

        <!-- Footer estilizado -->
        <footer class="header gsap__anim">
            <div class="parallax__wrapp">
                 <div class="content">
                    <h2 class="title">That's it!<span class="stroke"></span></h2>
                </div>
            </div>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://unpkg.com/lenis@1.3.23/dist/lenis.min.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <script src="js/js.js"></script>
</body>
</html>
