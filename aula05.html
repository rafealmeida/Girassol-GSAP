<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundamentos do DOM</title>
</head>
<style>
    body {
        background: black;
        color: white;
        font: normal 18pt arial;
    }
</style>

<body>

    <h1> Iniciando estudos com DOM </h1>
    <P> Aqui vai a linha de texto </P>
    <p> Aprendendo a usar o <strong>DOM</strong> em JavaScript </p>
    <div id="msg"> Clique aqui </div>
    <div name="msg name"> Teste</div>
    <div class="msg"> Teste2</div>

    <br>
    <script>
        window.document.write('Olá, mundo!<br>')
        window.document.write(window.document.charset + '<br>')
        window.document.write(window.navigator.appName + '<br>')
        window.document.write(window.document.URL + '<br>')

        var corpo = window.document.body
        var p1 = window.document.getElementsByTagName('p')[1]
        var d = window.document.getElementById('msg')
        var d2 = window.document.getElementByName('msg name ')[0]
        var d3 = window.document.getElementsByClassName('msg class')[0]

        window.document.write('Está escrito assim: ' + p1.innerText + '<br>')
        corpo.style.background = 'pink'
        p1.style.color = 'yellow'

        document.write(p1.innerHTML)
        window.alert(p1.innerText)
        d.style.background = 'green'
        d.innerText = 'Estou aguardando...'
        d2.innerText = 'Olá, eu sou o segundo elemento com esse mesmo nome'
        d3.innerText = 'Olá, eu sou o primeiro elemento'
        
    </script>
</body>

</html>
